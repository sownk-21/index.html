<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kit#TCC — My Favorite Games</title><style>body{margin:0;background:#08090d;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:45px 20px}h1{font-size:42px;margin:0}.sub{color:#9ca3af;margin:10px 0 30px}.search{width:100%;padding:15px;border-radius:12px;border:1px solid #303440;background:#11131a;color:#fff;font-size:16px;box-sizing:border-box;margin-bottom:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{padding:22px;min-height:150px;border:1px solid #292d39;border-radius:18px;background:linear-gradient(145deg,#151720,#0d0f14);transition:.2s}.card:hover{transform:translateY(-4px);border-color:#65708a}.num{color:#737b8d;font-size:12px}.title{font-size:23px;font-weight:bold;margin-top:10px}.type{color:#9ca3af;margin-top:8px;font-size:14px}</style></head><body><div class="wrap"><h1>kit#TCC</h1><div class="sub">🎮 My Favorite Games</div><input class="search" id="search" placeholder="🔍 Search my games..."><div class="grid" id="games"></div></div><script>const games=[["Cry of Fear","Horror • Psychological"],["Piromanic","Horror • Indie"],["Metro Exodus","Shooter • Post-apocalyptic"],["Afraid of the Monsters","Horror • Survival"],["Mirror's Edge Catalyst","Action • Parkour"],["Cyberpunk 2077","RPG • Open World"],["Dying Light: Stay Human","Action • Zombies • Parkour"]];function render(){let q=document.getElementById("search").value.toLowerCase();document.getElementById("games").innerHTML=games.filter(x=>(x[0]+" "+x[1]).toLowerCase().includes(q)).map((x,i)=>`<div class="card"><div class="num">GAME ${String(i+1).padStart(2,"0")}</div><div class="title">${x[0]}</div><div class="type">${x[1]}</div></div>`).join("")}document.getElementById("search").oninput=render;render();</script></body></html>
