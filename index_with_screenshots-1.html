<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kit#TCC — My Favorite Games</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07080c;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:42px 20px 70px}
header{margin-bottom:28px}h1{font-size:44px;margin:0}.sub{color:#9ca3af;margin-top:8px;font-size:17px}
.search{width:100%;padding:15px;border-radius:13px;border:1px solid #303440;background:#11131a;color:#fff;font-size:16px;outline:none;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.card{overflow:hidden;border:1px solid #292d39;border-radius:20px;background:#101219;transition:.2s}
.card:hover{transform:translateY(-5px);border-color:#667085}
.shot{width:100%;height:190px;object-fit:cover;display:block}
.info{padding:19px}.num{color:#737b8d;font-size:11px;letter-spacing:1px}.title{font-size:24px;font-weight:700;margin-top:8px}.type{color:#9ca3af;margin-top:7px;font-size:14px}
footer{margin-top:30px;color:#6f7685;font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>kit#TCC</h1>
<div class="sub">🎮 My Favorite Games</div>
</header>
<input class="search" id="search" placeholder="🔍 Search my games...">
<div class="grid" id="games"></div>
<footer>My Favorite Games • kit#TCC</footer>
</div>
<script>
const games=[
["Cry of Fear","Horror • Psychological","https://images.steamusercontent.com/ugc/12173254027798915871/07BC31523FD83AA2DAD4F49D788B2E9269D8FC93/?ima=fit&imcolor=%23000000&impolicy=Letterbox&imw=1024&letterbox=false"],
["Piromanic","Horror • Indie","https://img.ixbt.site/live/images/original/19/47/24/2026/03/04/71e774a34a.png?w=877"],
["Metro Exodus","Shooter • Post-apocalyptic","https://cdn.3dnews.ru/assets/external/illustrations/2019/02/13/982707/Metro_Exodus_screenshot_onpage_1.jpg"],
["Afraid of the Monsters","Horror • Survival","https://m.media-amazon.com/images/M/MV5BMDg1MWYxMTYtYWUxOS00MzE2LTg0NmEtMGQ5Yjk0YzdmOTkzXkEyXkFqcGc%40._V1_.jpg"],
["Mirror's Edge Catalyst","Action • Parkour","https://www.thepixelempire.net/uploads/1/2/1/1/12119064/mirror-s-edge-catalyst-playstation-4-13_orig.png"],
["Cyberpunk 2077","RPG • Open World","https://images.cgames.de/images/gamestar/226/cyberpunk-2077_6122403.jpg"],
["Dying Light: Stay Human","Action • Zombies • Parkour","https://www.imfdb.org/images/thumb/3/35/DyingLight_RaisGun_1.jpg/1200px-DyingLight_RaisGun_1.jpg"]
];
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 document.getElementById("games").innerHTML=games.filter(x=>(x[0]+" "+x[1]).toLowerCase().includes(q)).map((x,i)=>
 `<article class="card"><img class="shot" src="${x[2]}" alt="${x[0]} screenshot" loading="lazy"><div class="info"><div class="num">GAME ${String(i+1).padStart(2,"0")}</div><div class="title">${x[0]}</div><div class="type">${x[1]}</div></div></article>`
 ).join("");
}
document.getElementById("search").oninput=render;render();
</script>
</body>
</html>
